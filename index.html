<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <p>Checking for app...</p>
    </div>

    <script>
        window.onload = function() {
            const appUrl = "https://careem.go.link";
            const playStoreUrl = "https://play.google.com/store/apps/details?id=com.supercell.clashroyale";

            // 1. Try to "ping" the URL first
            fetch(appUrl, { mode: 'no-cors' })
                .then(() => {
                    // Link exists or at least responded! Try to open it.
                    window.location.href = appUrl;
                    
                    // 2. Secondary fallback just in case it doesn't open the app
                    setTimeout(() => {
                        window.location.href = playStoreUrl;
                    }, 3000);
                })
                .catch(() => {
                    // 3. The URL failed/doesn't exist. Go straight to Play Store.
                    window.location.href = playStoreUrl;
                });
        };
    </script>

</body>
</html>
