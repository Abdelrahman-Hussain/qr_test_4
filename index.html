<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App...</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>Connecting to the App...</h2>
        <p>If you aren't redirected automatically, 
           <a href="intent://careem.go.link#Intent;scheme=https;package=com.careem.acme;end">click here</a>.
        </p>
    </div>

    <script>
        window.onload = function() {
            // This is the special Android Intent format
            // 1. It tries to open the "trusted" link: careem.go.link
            // 2. It checks for the package: com.careem.acme
            // 3. If the app is NOT found, it automatically opens the Play Store for that package.
            var intentUrl = "intent://careem.go.link#Intent;scheme=https;package=com.careem.acme;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.careem.acme;end";

            // Trigger the intent
            window.location.href = intentUrl;
        };
    </script>

</body>
</html>
