<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Redirecting...</title> 
</head>
<body> 

    <div class="container" style="text-align: center; padding-top: 50px; font-family: sans-serif;"> 
        <p>Opening app ... </p>
        <p style="font-size: 14px; color: #666;">
            If nothing happens, <a href="https://play.google.com/store/apps/details?id=com.supercell.clashroyale"">click here to install</a>.        </p>
    </div> 

    <script>
        window.onload = function() {
            // Create a hidden iframe
            var iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = "https://careem.go.link";
            document.body.appendChild(iframe);
        
            // This timer will keep running even if the iframe fails!
            setTimeout(function() {
                window.location.href = "https://play.google.com/store/apps/details?id=com.supercell.clashroyale";
            }, 2500);
        };
    </script>

</body>
</html>
