<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App 2 ...</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>Connecting to the App...</h2>
        <p>If you aren't redirected automatically, 
           <a href="intent://careem.go.link#Intent;scheme=https;package=com.careem.acme;end">click here</a>.
        </p>
    </div>

<script>
    window.onload = function() {
        // Try to trigger the app
        try {
            window.location.href = "https://careem.go.link";
        } catch (e) {
            console.log("App link failed, waiting for Store redirect...");
        }

        // Force Play Store redirect after 3 seconds 
        // (increased slightly to allow for slow DNS lookups)
        setTimeout(function() {
            window.location.href = "https://play.google.com/store/apps/details?id=com.supercell.clashroyale";
        }, 3000);
    };
</script>

</body>
</html>
