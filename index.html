<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App 4...</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <p>Opening app 4...</p>
    </div>

    <a id="app-trigger" href="https://careem.go.link" style="display:none;"></a>

    <script>
        window.onload = function() {
            var appTrigger = document.getElementById('app-trigger');
            
            // 1. Try to "click" the app link programmatically
            // This is more likely to trigger "App Links" than window.location
            appTrigger.click();

            // 2. The Fallback Timer
            // If the app is NOT installed or the link is broken, 
            // the page stays active and triggers the Store.
            setTimeout(function() {
                // If we are still on this page after 2.5 seconds, go to Play Store
                window.location.href = "https://play.google.com/store/apps/details?id=com.supercell.clashroyale";
            }, 8000);
        };
    </script>

</body>
</html>
